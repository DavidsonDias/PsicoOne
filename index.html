        {"@type":"Question","name":"Quanto tempo leva para começar a usar?","acceptedAnswer":{"@type":"Answer","text":"Você pode começar a usar imediatamente após criar sua conta. Oferecemos um onboarding guiado que leva cerca de 10 minutos para configurar seu perfil, agenda e preferências."}},
        {"@type":"Question","name":"O PsicoOne é conforme à LGPD?","acceptedAnswer":{"@type":"Answer","text":"Sim. Implementamos criptografia de ponta a ponta, servidores no Brasil, controle de acesso granular, logs de auditoria e todas as políticas exigidas pela LGPD e CFP."}},
        {"@type":"Question","name":"Posso migrar meus dados de outro sistema?","acceptedAnswer":{"@type":"Answer","text":"Sim. Nossa equipe realiza a migração completa de prontuários, cadastros e histórico financeiro de qualquer sistema anterior sem custo adicional no plano Profissional."}},
        {"@type":"Question","name":"Como funciona o teleatendimento?","acceptedAnswer":{"@type":"Answer","text":"Sala virtual integrada ao sistema, sem instalar aplicativos. Inclui compartilhamento de tela, recursos terapêuticos, gravação com consentimento e transcrição automática com IA."}},
        {"@type":"Question","name":"Posso usar em mais de um dispositivo?","acceptedAnswer":{"@type":"Answer","text":"Sim. Funciona em qualquer dispositivo com navegador web e sincroniza automaticamente entre computador, tablet e celular."}},
        {"@type":"Question","name":"E se eu precisar cancelar?","acceptedAnswer":{"@type":"Answer","text":"Você pode cancelar a qualquer momento sem multas. Seus dados ficam disponíveis para exportação por 90 dias após o cancelamento."}},
        {"@type":"Question","name":"O suporte é via WhatsApp?","acceptedAnswer":{"@type":"Answer","text":"Sim. Atendimento via WhatsApp de segunda a sexta, das 8h às 20h, com plantão 24/7 para emergências técnicas."}},
        {"@type":"Question","name":"Quais formas de pagamento são aceitas?","acceptedAnswer":{"@type":"Answer","text":"Cartão de crédito, PIX, boleto bancário e débito em conta. Para clínicas, há faturamento mensal com nota fiscal."}}
      ]
    }
    </script>

  <body>
    <script>
      // Anti-flash: apply local appearance synchronously before React boots
      (function () {
        try {
          var raw = localStorage.getItem('psicoone_local_preferences');
          var p = raw ? JSON.parse(raw) : {};
          var theme = p.theme || 'system';
          var custom = ['midnight', 'arctic', 'obsidian', 'emerald', 'crimson', 'neopurple'];
          var isCustom = custom.indexOf(theme) !== -1;
          var resolved = isCustom
            ? theme
            : (theme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : theme);
          var root = document.documentElement;
          var all = ['light', 'dark'].concat(custom);
          for (var i = 0; i < all.length; i++) root.classList.remove(all[i]);
          root.classList.add(resolved);
          var lightThemes = ['light', 'arctic', 'emerald'];
          root.style.colorScheme = lightThemes.indexOf(resolved) !== -1 ? 'light' : 'dark';
          var hue = typeof p.primary_hue === 'number' ? p.primary_hue : 217;
          root.style.setProperty('--primary', hue + ' 91% 60%');
          root.style.setProperty('--primary-light', hue + ' 91% 70%');
          root.style.setProperty('--primary-dark', hue + ' 91% 50%');
          root.style.setProperty('--ring', hue + ' 91% 60%');
          root.dataset.density = p.density || 'comfortable';
          root.dataset.radius = p.radius || 'rounded';
          root.dataset.glow = p.glow || 'soft';
          root.dataset.sidebarStyle = p.sidebar_style || 'solid';
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
